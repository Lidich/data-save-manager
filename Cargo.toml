[package]
name = "data-save-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Typed in-process batching and lossless retry queues"

[features]
receipt-id = ["dep:uuid"]
postgres = ["dep:sqlx", "dep:serde"]

[dependencies]
opentelemetry = { version = "0.31", default-features = false, features = ["metrics"] }
serde = { version = "1", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "json"], optional = true }
tokio = { version = "1.41", features = ["sync", "time", "rt", "macros"] }
uuid = { version = "1.10", features = ["v4"], optional = true }

[dev-dependencies]
serde_json = "1"
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["metrics", "testing"] }
tokio = { version = "1.41", features = ["test-util", "rt-multi-thread"] }

[[bench]]
name = "queue"
harness = false

[[bench]]
name = "telemetry"
harness = false
